[project]
name = "pinwarden"
version = "0.0.1"
description = "Runtime security gateway for the Model Context Protocol: pinning, poisoning detection, policies and audit between MCP clients and servers."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "TheSIG-king" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
# Runtime dependencies are justified in docs/adr/0002-python-uv-stack.md.
# Exact versions are pinned in uv.lock; ranges here only bound major versions.
dependencies = [
    "mcp>=2.3,<3",
    "pydantic>=2.14,<3",
    "pyyaml>=6.0.3,<7",
    "structlog>=26.1,<27",
]

[project.scripts]
pinwarden = "pinwarden.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "hypothesis>=6.170,<7",
    "ruff>=0.17.4,<0.18",
    "mypy>=2.4,<3",
    "types-pyyaml>=6.0.12",
    "pre-commit>=4.7,<5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pinwarden"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "BLE", "A", "C4", "SIM", "PTH", "RUF", "ASYNC", "PL",
]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: spawns real MCP server processes (local only)",
    "adversarial: runs local malicious test servers / attack corpus",
]
